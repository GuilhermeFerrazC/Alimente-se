name: Robot Framework Tests

on:
  push:
    branches:
      - develop
      - main
      - 'feature/**'
  pull_request:

jobs:
  robot-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install Robot Framework
        run: pip install robotframework

      - name: Run Robot Tests
        run: robot tests/
